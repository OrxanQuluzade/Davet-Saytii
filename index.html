<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Date Planımız 💕</title>
    <!-- Konfeti Effekti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ffffff;
            border: none;
            font-size: 20px;
            padding: 10px 14px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            z-index: 100;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* ADDIMLARIN IDARƏSİ */
        .step {
            display: none;
        }

        .step.active {
            display: block !important;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: #ff4b2b;
            margin-bottom: 12px;
            font-size: 22px;
        }

        h3 {
            color: #444;
            font-size: 15px;
            margin-bottom: 8px;
            text-align: left;
        }

        p {
            color: #666;
            font-size: 15px;
            margin-bottom: 20px;
        }

        button {
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .full-width-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 75, 43, 0.3);
            margin-top: 10px;
        }

        .secondary-btn {
            background: #f0f0f0;
            color: #555;
            margin-top: 10px;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-container button {
            flex: 1;
            padding: 12px;
        }

        #yesBtn { background: #28a745; color: white; }
        #noBtn { background: #dc3545; color: white; }

        .category-block { margin-bottom: 18px; }

        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .option-btn {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            color: #495057;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 20px;
        }

        .option-btn.selected {
            background: #ff416c;
            color: #ffffff;
            border-color: #ff416c;
        }

        .summary-box {
            background: #fff5f5;
            border: 1px dashed #ffb3b3;
            padding: 12px;
            border-radius: 10px;
            text-align: left;
            margin: 15px 0;
            font-size: 14px;
        }

        .ai-suggestion-box {
            display: none;
            background: #f0f8ff;
            border: 1px solid #b8daff;
            color: #004085;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: left;
        }

        .feedback-status {
            color: #28a745;
            font-weight: 600;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop src="https://raw.githubusercontent.com/OrxanQuluzade/Davet-Saytii/main/pmml.mp3" preload="auto"></audio>
    <button id="musicToggleBtn" class="music-btn" title="Musiqi">🎵</button>

    <div class="container">
        <div id="card" class="card">

            <!-- ADDIM 1: Qarşılama -->
            <div class="step active" id="step1">
                <h2>Hellolardan bir demət Nərmin xanım! 😍</h2>
                <p>Mənimlə çıxarsan?</p>
                <div class="btn-container">
                    <button id="yesBtn">Bəli, çıxaram! 💕</button>
                    <button id="noBtn">Xeyr 😢</button>
                </div>
            </div>

            <!-- ADDIM 2: Plan Seçimi -->
            <div class="step" id="step2">
                <h2>Planımızı Quraq! 🗓️</h2>
                <p style="font-size: 13px;">İstədiyin kateqoriyaya bas və seç:</p>

                <div id="categoriesContainer"></div>
                <div class="summary-box" id="liveSummary"></div>

                <button id="aiSuggestBtn" class="secondary-btn full-width-btn">🤖 AI Tövsiyəsi Al</button>
                <div class="ai-suggestion-box" id="aiSuggestionBox"></div>

                <button id="finishPlanBtn" class="full-width-btn">Planı Tamamla 🎉</button>
            </div>

            <!-- ADDIM 3: Yekun -->
            <div class="step" id="step3">
                <h2>Möhtəşəm Date Planı! 🎊</h2>
                <div class="summary-box" id="finalSummary"></div>
                <div class="ai-suggestion-box" id="finalAiBox"></div>
                <p class="feedback-status" id="sendStatus">Səni səbirsizliklə gözləyirəm! 💘</p>
                <button id="restartBtn" class="secondary-btn full-width-btn">Yenidən planlaşdır</button>
            </div>

            <!-- İMTİNA ADDIMI -->
            <div class="step" id="stepDecline">
                <h2>Çox təəssüf! 😢</h2>
                <p>Fikrini dəyişsən, buradayam!</p>
                <button id="restartBtn2" class="secondary-btn full-width-btn">Geri qayıt</button>
            </div>

        </div>
    </div>

    <script>
        const FORMSPREE_ENDPOINT = "https://formspree.io/f/orxnquluzada@gmail.com";
        const guestName = "Nərmin xanım";

        const categories = [
            {
                id: "food",
                title: "🍕 Yemək / Məkan",
                options: ["Qəhvə & Desert", "Pizza & Burger", "Romantik Şam Yeməyi", "Şərq Mətbəxi", "Piknik"]
            },
            {
                id: "activity",
                title: "🎬 Əyləncə & Fəaliyyət",
                options: ["Kino / Teatr", "Parkda Gəzinti", "Bouling / Kartinq", "Muzey / Sərgi", "Karaoke"]
            },
            {
                id: "time",
                title: "⏰ Vaxt Seçimi",
                options: ["Səhər (10:00 - 13:00)", "Günorta (14:00 - 17:00)", "Axşam (18:00 - 21:00)"]
            }
        ];

        let selectedOptions = {};

        document.addEventListener("DOMContentLoaded", () => {
            const bgMusic = document.getElementById("bgMusic");
            const musicToggleBtn = document.getElementById("musicToggleBtn");
            const yesBtn = document.getElementById("yesBtn");
            const noBtn = document.getElementById("noBtn");
            const aiSuggestBtn = document.getElementById("aiSuggestBtn");
            const finishPlanBtn = document.getElementById("finishPlanBtn");
            const restartBtn = document.getElementById("restartBtn");
            const restartBtn2 = document.getElementById("restartBtn2");

            function playAudio() {
                if (bgMusic && bgMusic.paused) {
                    bgMusic.play().then(() => {
                        if (musicToggleBtn) musicToggleBtn.textContent = "🎵";
                    }).catch(err => console.log(err));
                }
            }

            if (musicToggleBtn && bgMusic) {
                musicToggleBtn.addEventListener("click", () => {
                    if (bgMusic.paused) {
                        playAudio();
                    } else {
                        bgMusic.pause();
                        musicToggleBtn.textContent = "🔇";
                    }
                });
            }

            if (yesBtn) {
                yesBtn.addEventListener("click", () => {
                    playAudio();
                    renderCategories();
                    showStep("step2");
                });
            }

            if (noBtn) {
                noBtn.addEventListener("mouseover", () => {
                    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
                    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
                    noBtn.style.position = "fixed";
                    noBtn.style.left = `${Math.max(10, x)}px`;
                    noBtn.style.top = `${Math.max(10, y)}px`;
                });

                noBtn.addEventListener("click", () => {
                    showStep("stepDecline");
                });
            }

            if (aiSuggestBtn) {
                aiSuggestBtn.addEventListener("click", () => {
                    const aiBox = document.getElementById("aiSuggestionBox");
                    const suggestions = [
                        "💡 AI Tövsiyəsi: Rahat bir kofedə başlayıb, sonra parkda gəzintiyə çıxmaq əla olar!",
                        "💡 AI Tövsiyəsi: Birlikdə dadlı pizza yeyib ardınca maraqlı bir film izləyə bilərsiniz! 🍕🎬",
                        "💡 AI Tövsiyəsi: Axşamüstü gəzinti və ardınca şirin desertlər günü unudulmaz edəcək! 🍰✨"
                    ];
                    const randomSuggest = suggestions[Math.floor(Math.random() * suggestions.length)];
                    if (aiBox) {
                        aiBox.textContent = randomSuggest;
                        aiBox.style.display = "block";
                    }
                });
            }

            if (finishPlanBtn) {
                finishPlanBtn.addEventListener("click", async () => {
                    const summaryText = buildSummaryText();
                    const finalSummary = document.getElementById("finalSummary");
                    if (finalSummary) {
                        finalSummary.innerHTML = `<p>👤 <strong>Qonaq:</strong> ${guestName}</p>${summaryText}`;
                    }

                    const aiBoxContent = document.getElementById("aiSuggestionBox")?.textContent || "Tövsiyə seçilmədi";
                    const finalAiBox = document.getElementById("finalAiBox");
                    if (finalAiBox && aiBoxContent !== "Tövsiyə seçilmədi") {
                        finalAiBox.textContent = aiBoxContent;
                        finalAiBox.style.display = "block";
                    }

                    const sendStatus = document.getElementById("sendStatus");
                    if (sendStatus) sendStatus.textContent = "Plan mailə göndərilir... ⏳";

                    try {
                        await fetch(FORMSPREE_ENDPOINT, {
                            method: "POST",
                            headers: { "Content-Type": "application/json", "Accept": "application/json" },
                            body: JSON.stringify({
                                "Qonaq": guestName,
                                "Seçilmiş Plan": getSummaryPlain(),
                                "AI Tövsiyəsi": aiBoxContent
                            })
                        });
                        if (sendStatus) sendStatus.textContent = "Plan mailə uğurla göndərildi! Səni səbirsizliklə gözləyirəm! 💘";
                    } catch (err) {
                        if (sendStatus) sendStatus.textContent = "Plan qeydə alındı! Səni səbirsizliklə gözləyirəm! 💘";
                    }

                    showStep("step3");
                    if (window.confetti) confetti();
                });
            }

            if (restartBtn) restartBtn.addEventListener("click", resetAll);
            if (restartBtn2) restartBtn2.addEventListener("click", resetAll);

            function resetAll() {
                selectedOptions = {};
                document.getElementById("liveSummary").innerHTML = "";
                document.getElementById("aiSuggestionBox").style.display = "none";
                showStep("step1");
            }
        });

        function showStep(stepId) {
            document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
            const target = document.getElementById(stepId);
            if (target) target.classList.add("active");
        }

        function renderCategories() {
            const container = document.getElementById("categoriesContainer");
            if (!container) return;
            container.innerHTML = "";

            categories.forEach(cat => {
                const catDiv = document.createElement("div");
                catDiv.className = "category-block";

                const title = document.createElement("h3");
                title.textContent = cat.title;
                catDiv.appendChild(title);

                const optionsDiv = document.createElement("div");
                optionsDiv.className = "options-grid";

                cat.options.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.textContent = opt;

                    if (selectedOptions[cat.id] === opt) {
                        btn.classList.add("selected");
                    }

                    btn.addEventListener("click", () => {
                        if (selectedOptions[cat.id] === opt) {
                            delete selectedOptions[cat.id];
                        } else {
                            selectedOptions[cat.id] = opt;
                        }
                        renderCategories();
                        updateLiveSummary();
                    });

                    optionsDiv.appendChild(btn);
                });

                catDiv.appendChild(optionsDiv);
                container.appendChild(catDiv);
            });
        }

        function updateLiveSummary() {
            const box = document.getElementById("liveSummary");
            if (!box) return;
            box.innerHTML = buildSummaryText() || "<p>Hələ heç nə seçilməyib.</p>";
        }

        function buildSummaryText() {
            let html = "";
            categories.forEach(cat => {
                if (selectedOptions[cat.id]) {
                    html += `<p><strong>${cat.title}:</strong> ${selectedOptions[cat.id]}</p>`;
                }
            });
            return html;
        }

        function getSummaryPlain() {
            let text = "";
            categories.forEach(cat => {
                if (selectedOptions[cat.id]) {
                    text += `${cat.title}: ${selectedOptions[cat.id]} | `;
                }
            });
            return text || "Heç nə seçilməyib";
        }
    </script>
</body>
</html>
