<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Date Planımız 💕</title>
    <link rel="stylesheet" href="style.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- Musiqi Pleyeri -->
    <audio id="bgMusic" loop src="pmml.mp3" preload="auto"></audio>
    <button id="musicToggleBtn" class="music-btn" title="Musiqi">🎵</button>

    <div class="container">
        <!-- FORM: Birbaşa sənin mailinə göndərir -->
        <form id="dateForm" action="https://formspree.io/f/orxnquluzada@gmail.com" method="POST" class="card">

            <!-- Gizli inputlar: Seçimləri və AI mətnini mailə daşımaq üçün -->
            <input type="hidden" name="Qonaq_Adi" id="inputGuestName">
            <input type="hidden" name="Secilmis_Planlar" id="inputPlanSummary">
            <input type="hidden" name="AI_Tovsiyesi" id="inputAiSuggestion">

            <!-- ADDIM 1: Ad Girişi -->
            <div class="step active" id="step1">
                <h2>Xoş gəldin! 🌸</h2>
                <p>Zəhmət olmasa adını daxil et:</p>
                <input type="text" id="nameInput" placeholder="Adını yaz...">
                <button type="button" id="startBtn" class="full-width-btn">Davam et ➔</button>
            </div>

            <!-- ADDIM 2: Bəli / Xeyr Sualı -->
            <div class="step" id="step2">
                <h2 id="greetingTitle">Hellolardan bir demət! 😍</h2>
                <p>Mənimlə çıxarsan?</p>
                <div class="btn-container">
                    <button type="button" id="yesBtn">Bəli, çıxaram! 💕</button>
                    <button type="button" id="noBtn">Xeyr 😢</button>
                </div>
            </div>

            <!-- ADDIM 3: Plan Seçimi -->
            <div class="step" id="step3">
                <h2>Planımızı Quraq! 🗓️</h2>
                <p style="font-size: 13px;">İstədiyin kateqoriyaya bas və seç:</p>

                <div id="categoriesContainer"></div>
                <div class="summary-box" id="liveSummary"></div>

                <button type="button" id="aiSuggestBtn" class="secondary-btn full-width-btn">🤖 AI Tövsiyəsi Al</button>
                <div class="ai-suggestion-box" id="aiSuggestionBox"></div>

                <!-- SUBMIT DÜYMƏSİ: Formspree-ni işə salır və mail gəlir -->
                <button type="submit" id="finishPlanBtn" class="full-width-btn">Planı Tamamla & Mail Göndər 🎉</button>
            </div>

            <!-- İMTİNA -->
            <div class="step" id="stepDecline">
                <h2>Çox təəssüf! 😢</h2>
                <p>Fikrini dəyişsən, buradayam!</p>
                <button type="button" id="restartBtn2" class="secondary-btn full-width-btn">Geri qayıt</button>
            </div>

        </form>
    </div>

    <script src="index.js"></script>
</body>
</html>
