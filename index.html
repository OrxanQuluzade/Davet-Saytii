<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dəvətnamə</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Musiqi Pleyeri (Zəmanətli Onlayn Audio Linki) -->
    <audio id="bgMusic" loop src="https://files.freemusicarchive.org/storage-freemusicarchive-org/tracks/79bOefK8vQkGTo3S8fpt8hP03qBq0Wl1bWJtY5eJ.mp3" preload="auto"></audio>

    <!-- Musiqi Yandırıb-Söndürmə Düyməsi -->
    <button id="musicToggleBtn" class="music-btn">🎵</button>

    <div class="container">
        <div id="card" class="card">
            <h1 id="greetingTitle">Xoş gəlmisiniz!</h1>
            <p id="guestNameText">Dəvətnamənizi görmək üçün düyməyə sıxın.</p>
            <button id="nextNameBtn" class="action-btn">Davam Et</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
